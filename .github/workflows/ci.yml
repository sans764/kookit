name: Kookit learning fork CI

on:
  push:
    branches: [feature/word-decorations, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      - run: yarn benchmark:word-decorations
